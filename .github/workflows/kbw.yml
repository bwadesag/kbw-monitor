name: KBW 8h-18h
on:
  schedule:
    # UTC. Heure locale = UTC+1 (Cameroun).
    # 8:00, puis 13:50 pour couvrir jusqu'à 18:00 sans dépasser 6h par job.
    - cron: "0 7 * * *"
    - cron: "50 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kbw-bot-unique
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install playwright requests && playwright install chromium --with-deps
      - name: Scan until 18h
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python -u check.py
