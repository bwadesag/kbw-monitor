name: KBW Yaounde B2 - Full Scan 36 events

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright requests
          playwright install chromium --with-deps
      - name: Scan 36 creneaux sur 4 pages
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_IDS: "8806922221,-5434725968"
        run: |
          python check.py
