name: KBW 8h-18h
on:
  schedule:
    # UTC. Heure locale = UTC+1. Minute 0 is often dropped, so nothing starts at :00.
    # 8:10, backup 9:30, then 13:50 and 15:10. A run already going is left alone.
    - cron: "10 7 * * *"
    - cron: "30 8 * * *"
    - cron: "50 12 * * *"
    - cron: "10 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: kbw-bot-unique
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install playwright requests && playwright install chromium --with-deps
      - name: Scan until 18h
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python -u check.py
      - name: Relais avant 18h
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f CONTINUE.txt ]; then echo "18h atteinte, pas de relais"; exit 0; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/kbw.yml/dispatches" \
            -d '{"ref":"main"}'
