name: KBW 60 Secondes
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright requests && playwright install chromium --with-deps
      - run: python -u check.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
